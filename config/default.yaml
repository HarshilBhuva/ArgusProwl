app_name: ArgusProwl
debug: false
environment: production
logging:
  level: INFO
  console_enabled: true
  file_enabled: true
  json_enabled: false
  log_file: logs/argusprowl.log
  json_log_file: logs/argusprowl.json
  max_bytes: 10485760
  backup_count: 5
  colored_console: true
storage:
  backend: sqlite
  base_path: data
  database_path: data/argusprowl.db
events:
  queue_size: 1000
  async_dispatch: false
  worker_count: 1
  shutdown_timeout_seconds: 5.0
reliability:
  buffer:
    max_size: 1000
    overflow_policy: drop_newest
  retry:
    max_attempts: 3
    initial_delay: 0.1
    max_delay: 5.0
    jitter: false
  deduplication:
    enabled: true
    default_cooldown: 300.0
    max_fingerprints: 10000
  alert_queue:
    max_size: 10000
temporal:
  enabled: true
  max_keys: 10000
  max_observations_per_key: 1000
  window_duration_seconds: 3600.0
  min_observations: 10
  min_duration_seconds: 300.0
  periodicity_threshold: 0.7
endpoint_correlation:
  enabled: true
  correlation_window_seconds: 30.0
  max_processes: 10000
  max_observations: 1000
event_count_correlation:
  enabled: true
  max_keys: 10000
  max_observations_per_key: 1000
  default_count: 5
  default_timespan_seconds: 300.0
  default_group_by:
  - src_ip
  default_confidence: 0.7
sysmon:
  enabled: false
  channel: Microsoft-Windows-Sysmon/Operational
  bookmark_path: data/sysmon-bookmark.json
  batch_size: 100
  polling_interval: 1.0
  supported_event_ids:
  - 1
  - 3
  - 7
  - 8
  - 10
  - 11
  - 12
  - 13
  - 14
  - 22
windows_event_log:
  enabled: false
  channels:
  - Security
  bookmark_path: data/windows-event-bookmarks.json
  batch_size: 100
  polling_interval: 1.0
  event_ids:
  - 4624
  - 4625
  - 4648
  - 4672
  - 4688
  - 4697
  - 4720
  - 4728
  - 4732
  - 4756
  - 1102
linux_audit:
  enabled: false
  path: /var/log/audit/audit.log
  bookmark_path: data/linux-audit-bookmark.json
  batch_size: 100
  polling_interval: 1.0
  grouping_timeout: 1.0
  max_pending_groups: 1000
  supported_record_types:
  - SYSCALL
  - EXECVE
  - USER_LOGIN
  - USER_START
  - USER_ACCT
  - USER_CMD
  - USER_ROLE_CHANGE
  - USER_CHAUTHTOK
  - CRED_ACQ
  - CRED_REFR
  - CRED_DISP
  - USER_END
behavior:
  enabled: true
  max_profiles: 100000
  max_values_per_profile: 1000
  max_value_length: 256
  stale_timeout_hours: 24
alert_persistence:
  enabled: true
  db_path: data/alerts.db
  max_alerts: 10000
attck:
  enabled: true
  snapshot_path: data/attck_snapshot.json
  previous_snapshot_path: ''
baseline:
  enabled: true
  maturity_min_observations: 20
  maturity_window_seconds: 3600
  rare_threshold: 5
  future_skew_threshold_seconds: 60
  max_distinct_values: 1000
  max_observations_retained: 10000
  stale_after_seconds: 86400
