[project]
name = "argusprowl"
version = "0.1.0"
description = "A production-grade, modular, host-based cybersecurity threat detection platform."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    {name = "Harshil Bhuva"},
]
keywords = ["cybersecurity", "threat-detection", "security", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = []

[project.scripts]
argusprowl = "argusprowl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["argusprowl*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["argusprowl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]
