name: Refresh Security Lockfile

on:
  push:
    branches:
      - "security/pydantic-lock-refresh"

permissions:
  contents: write

concurrency:
  group: security-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Regenerate lockfile with patched Pydantic
        run: uv lock --upgrade-package pydantic

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): refresh Pydantic lockfile"
          git push origin "HEAD:${{ github.ref_name }}"
