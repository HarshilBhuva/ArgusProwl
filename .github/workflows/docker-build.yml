name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "frontend/**"
      - "src/**"
      - "config/**"
      - "scripts/download_attck_snapshot.py"
      - "scripts/smoke_docker_image.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "frontend/**"
      - "src/**"
      - "config/**"
      - "scripts/download_attck_snapshot.py"
      - "scripts/smoke_docker_image.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

# Avoid wasting runner minutes building obsolete commits on the same ref.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose config
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: argusprowl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for high and critical vulnerabilities
        # Pinned to the verified v0.36.0 action commit for supply-chain integrity.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "argusprowl:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run runtime smoke checks against the built image
        run: bash scripts/smoke_docker_image.sh argusprowl:ci
