name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "frontend/**"
      - "src/**"
      - "config/**"
      - "scripts/download_attck_snapshot.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "frontend/**"
      - "src/**"
      - "config/**"
      - "scripts/download_attck_snapshot.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

# Avoid wasting runner minutes building obsolete commits on the same ref.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: argusprowl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for high and critical vulnerabilities
        # Pinned to the verified v0.36.0 action commit for supply-chain integrity.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "argusprowl:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Boot image and check API health
        run: |
          docker run -d --name argusprowl-ci -p 8080:8080 \
            -e TH_API__HOST=0.0.0.0 -e TH_API__PORT=8080 argusprowl:ci
          deadline=$((SECONDS + 20))
          until curl --fail --silent --show-error --max-time 1 http://localhost:8080/health > /dev/null; do
            if (( SECONDS >= deadline )); then
              echo "API never became healthy within 20 seconds"
              docker logs argusprowl-ci
              exit 1
            fi
            sleep 0.2
          done
          echo "API is healthy"
