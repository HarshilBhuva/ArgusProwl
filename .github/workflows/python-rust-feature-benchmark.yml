name: Python vs Rust Feature Pipeline Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/python-rust-feature-benchmark.yml"
      - "benchmarks/rust_feature_extraction/**"
      - "scripts/benchmarks/python_feature_aggregation.py"
      - "src/argusprowl/feature_engineering/**"
      - "src/argusprowl/models/normalized_event.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: python-rust-feature-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python project
        run: uv sync --frozen
      - name: Build Rust release binary
        run: cargo build --release --manifest-path benchmarks/rust_feature_extraction/Cargo.toml
      - name: Paired end-to-end feature pipeline runs
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          for workers in 1 2 4; do
            for repetition in 1 2 3 4 5; do
              echo "workers=${workers} repetition=${repetition} Python"
              uv run python scripts/benchmarks/python_feature_aggregation.py --events 5000 --workers "$workers" > "benchmark-results/python-w${workers}-r${repetition}.json"
              echo "workers=${workers} repetition=${repetition} Rust"
              "benchmarks/rust_feature_extraction/target/release/argusprowl-rust-feature-bench" 5000 "$workers" > "benchmark-results/rust-w${workers}-r${repetition}.json"
            done
          done
      - name: Validate feature parity and summarize
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path

          root = Path("benchmark-results")
          fields = (
              "connection_count", "unique_dst_ports", "unique_dst_ips",
              "failed_connections", "syn_count", "avg_duration", "max_duration",
              "min_duration", "std_duration", "total_bytes_sent",
              "total_bytes_received", "avg_bytes_per_connection", "connection_rate",
              "bytes_rate", "port_concentration", "is_multi_port", "is_multi_dst",
              "time_since_first_connection", "src_port", "dst_port", "unique_src_ports",\n              "dst_ports_list_len", "dst_ips_list_len",
          )
          report = {
              "scope": "NormalizedEvent construction/validation + FeatureExtractor registry + SlidingWindow + aggregation + FeatureVector construction/validation; excludes collectors, queues, rules, enrichment, alerting, storage and API",
              "events_per_worker": 5000,
              "window_seconds": 60,
              "max_events_per_window": 512,
              "source_count": 8,
              "repetitions": 5,
              "results": [],
          }
          for workers in (1, 2, 4):
              samples = {}
              for language in ("python", "rust"):
                  samples[language] = [
                      json.loads(path.read_text())
                      for path in sorted(root.glob(f"{language}-w{workers}-r*.json"))
                  ]
                  if len(samples[language]) != 5:
                      raise SystemExit(f"Expected five {language} samples for {workers} workers")
                  for sample in samples[language]:
                      if sample["unprocessed_events"] != 0:
                          raise SystemExit(f"Unprocessed events: {language}, {workers} workers")
                      if sample["processed_events"] != 5000 * workers:
                          raise SystemExit(f"Processed event count mismatch: {language}, {workers} workers")
              py, rs = samples["python"], samples["rust"]
              py_sums = {key: statistics.median(s["feature_sums"][key] for s in py) for key in fields}
              rs_sums = {key: statistics.median(s["feature_sums"][key] for s in rs) for key in fields}
              deltas = {}
              for key in fields:
                  delta = abs(py_sums[key] - rs_sums[key]) / max(abs(py_sums[key]), 1.0)
                  deltas[key] = delta
                  if delta > 1e-8:
                      raise SystemExit(f"Feature parity failed for {key} at {workers} workers: {delta}")
              py_t = statistics.median(s["throughput_events_per_second"] for s in py)
              rs_t = statistics.median(s["throughput_events_per_second"] for s in rs)
              latency = {}
              for language in ("python", "rust"):
                  latency[language] = {
                      key: statistics.median(s["latency_ms"][key] for s in samples[language])
                      for key in ("p50", "p95", "p99", "max")
                  }
              memory = {
                  language: statistics.median(s["peak_rss_kib"] for s in samples[language])
                  for language in ("python", "rust")
              }
              report["results"].append({
                  "workers": workers,
                  "python_median_events_per_second": py_t,
                  "rust_median_events_per_second": rs_t,
                  "rust_speedup": rs_t / py_t,
                  "python_latency_ms": latency["python"],
                  "rust_latency_ms": latency["rust"],
                  "python_peak_rss_kib": memory["python"],
                  "rust_peak_rss_kib": memory["rust"],
                  "max_feature_relative_delta": max(deltas.values()),
                  "feature_relative_deltas": deltas,
                  "python_active_windows_median": statistics.median(s["active_windows"] for s in py),
                  "rust_active_windows_median": statistics.median(s["active_windows"] for s in rs),
              })
          (root / "summary.json").write_text(json.dumps(report, indent=2) + "\\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload raw benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-rust-feature-pipeline-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
