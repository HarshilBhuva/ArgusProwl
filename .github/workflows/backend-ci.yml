name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile check
        run: uv run python -m compileall -q src tests scripts

      - name: Lint (ruff) - check
        run: uv run ruff check src tests

      - name: Run full test suite
        run: uv run pytest -q --maxfail=1

      - name: Validate config (no external services)
        run: uv run python -m argusprowl validate-config

  security-scan:
    name: Bandit static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Run Bandit security scan
        # -ll reports medium/high severity findings; low-severity noise is excluded.
        run: uvx --from bandit==1.9.4 bandit -r src/ -ll

  postgresql-integration:
    name: PostgreSQL storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: argusprowl_test
          POSTGRES_USER: argusprowl
          POSTGRES_PASSWORD: argusprowl-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argusprowl -d argusprowl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUSPROWL_TEST_DATABASE_URL: postgresql://argusprowl:argusprowl-ci-password@localhost:5432/argusprowl_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and PostgreSQL driver
        run: |
          uv sync --frozen
          uv pip install --python .venv/bin/python 'psycopg[binary,pool]>=3.2.3'
      - name: Run PostgreSQL integration tests
        run: uv run pytest -q tests/integration/test_postgresql_adapter.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start product container
        env:
          TH_API__AUTH_ENABLED: "true"
          ARGUSPROWL_API_KEY: argusprowl-ci-test-key-0123456789abcdef0123456789abcdef
        run: docker compose up -d --build

      - name: Wait for API health endpoint
        run: |
          deadline=$((SECONDS + 20))
          until curl --fail --silent --show-error --max-time 1 http://localhost:8080/health > /dev/null; do
            if (( SECONDS >= deadline )); then
              echo "API never became healthy within 20 seconds"
              docker compose logs argusprowl
              exit 1
            fi
            sleep 0.2
          done
          echo "API is healthy"

      - name: Tear down
        if: always()
        run: docker compose down -v
