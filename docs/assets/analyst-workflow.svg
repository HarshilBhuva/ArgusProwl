<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc"><title id="title">ArgusProwl analyst workflow — animated</title><desc id="desc">Analyst workflow connecting dashboard, alerts, evidence, entities and incident review.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="p1" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="p2" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="p3" x2="1" y2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient><linearGradient id="p4" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#c2410c"/></linearGradient><linearGradient id="p5" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#94a3b8"/></marker></defs><style>
 @keyframes ambientPulse {0%,100%{opacity:.08;transform:scale(1)}50%{opacity:.19;transform:scale(1.12)}}
 .ambient {transform-box:fill-box;transform-origin:center;animation:ambientPulse 7s ease-in-out infinite}
 @media (prefers-reduced-motion:reduce){.ambient{animation:none}}
 </style><rect width="1440" height="430" rx="26" fill="url(#bg)"/><text x="60" y="65" fill="#fff" font-family="Arial" font-size="30" font-weight="800">The analyst's investigation loop</text><text x="60" y="98" fill="#cbd5e1" font-family="Arial" font-size="17">Move from alert triage to contextual review with linked evidence</text>
<g font-family="Arial"><rect x="65" y="160" width="220" height="145" rx="18" fill="#172554" stroke="#38bdf8"/><rect x="65" y="160" width="220" height="8" rx="4" fill="url(#p1)"/><text x="90" y="207" fill="#7dd3fc" font-size="14" font-weight="700">01 / TRIAGE</text><text x="90" y="248" fill="#fff" font-size="23" font-weight="700">Alert queue</text><text x="90" y="280" fill="#dbeafe" font-size="16">Severity · status · time</text>
<rect x="350" y="160" width="220" height="145" rx="18" fill="#2e1065" stroke="#a78bfa"/><rect x="350" y="160" width="220" height="8" rx="4" fill="url(#p2)"/><text x="375" y="207" fill="#c4b5fd" font-size="14" font-weight="700">02 / EXAMINE</text><text x="375" y="248" fill="#fff" font-size="23" font-weight="700">Evidence</text><text x="375" y="280" fill="#ede9fe" font-size="16">Events · reasons · source</text>
<rect x="635" y="160" width="220" height="145" rx="18" fill="#500724" stroke="#f472b6"/><rect x="635" y="160" width="220" height="8" rx="4" fill="url(#p3)"/><text x="660" y="207" fill="#f9a8d4" font-size="14" font-weight="700">03 / CONNECT</text><text x="660" y="248" fill="#fff" font-size="23" font-weight="700">Entities</text><text x="660" y="280" fill="#fce7f3" font-size="16">Host · user · IP · process</text>
<rect x="920" y="160" width="220" height="145" rx="18" fill="#431407" stroke="#fb923c"/><rect x="920" y="160" width="220" height="8" rx="4" fill="url(#p4)"/><text x="945" y="207" fill="#fdba74" font-size="14" font-weight="700">04 / ORGANIZE</text><text x="945" y="248" fill="#fff" font-size="23" font-weight="700">Incidents</text><text x="945" y="280" fill="#ffedd5" font-size="16">Related activity · notes</text>
<rect x="1205" y="160" width="190" height="145" rx="18" fill="#064e3b" stroke="#34d399"/><rect x="1205" y="160" width="190" height="8" rx="4" fill="url(#p5)"/><text x="1228" y="207" fill="#6ee7b7" font-size="14" font-weight="700">05 / DECIDE</text><text x="1228" y="248" fill="#fff" font-size="23" font-weight="700">Disposition</text><text x="1228" y="280" fill="#d1fae5" font-size="16">Human-led follow-up</text></g><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M285 232H340"/><path d="M570 232H625"/><path d="M855 232H910"/><path d="M1140 232H1195"/></g><text x="65" y="365" fill="#cbd5e1" font-family="Arial" font-size="16">Every step should be grounded in the evidence and context actually retained by the platform.</text><g aria-hidden="true"><circle class="ambient" cx="1370" cy="120" r="32" fill="#a78bfa"/><circle class="ambient" cx="95" cy="390" r="24" fill="#22d3ee" style="animation-delay:-3s"/><circle r="5.5" fill="#7dd3fc" opacity=".98" filter="url(#none)"><animateMotion dur="1.50s" begin="0.00s" repeatCount="indefinite" path="M285 232H340"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#c4b5fd" opacity=".98" filter="url(#none)"><animateMotion dur="1.67s" begin="0.23s" repeatCount="indefinite" path="M570 232H625"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#f9a8d4" opacity=".98" filter="url(#none)"><animateMotion dur="1.84s" begin="0.46s" repeatCount="indefinite" path="M855 232H910"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#fdba74" opacity=".98" filter="url(#none)"><animateMotion dur="2.01s" begin="0.69s" repeatCount="indefinite" path="M1140 232H1195"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle></g></svg>