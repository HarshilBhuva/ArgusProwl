<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">ArgusProwl platform architecture — animated</title><desc id="desc">Colorful architecture diagram showing telemetry ingestion, normalized event processing, detection, decisioning, persistence, API, analyst interface and entity intelligence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172d"/><stop offset="1" stop-color="#1d1740"/></linearGradient><linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="violet" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient><linearGradient id="orange" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker></defs><style>
 @keyframes ambientPulse {0%,100%{opacity:.08;transform:scale(1)}50%{opacity:.19;transform:scale(1.12)}}
 .ambient {transform-box:fill-box;transform-origin:center;animation:ambientPulse 7s ease-in-out infinite}
 @media (prefers-reduced-motion:reduce){.ambient{animation:none}}
 </style>
<rect width="1440" height="820" rx="28" fill="url(#bg)"/><circle cx="1290" cy="100" r="180" fill="#7c3aed" opacity=".10"/><circle cx="120" cy="760" r="210" fill="#06b6d4" opacity=".09"/>
<text x="64" y="66" fill="#e2e8f0" font-family="Inter,Arial" font-size="17" font-weight="700" letter-spacing="3">ARGUSPROWL / SYSTEM MAP</text><text x="64" y="112" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="800">From raw telemetry to evidence-led investigations</text>
<g font-family="Inter,Arial" filter="url(#shadow)">
<rect x="60" y="190" width="230" height="190" rx="20" fill="#172554" stroke="#3b82f6"/><rect x="60" y="190" width="230" height="9" rx="5" fill="url(#cyan)"/><text x="84" y="235" fill="#7dd3fc" font-size="14" font-weight="700">01 / INPUT</text><text x="84" y="274" fill="#fff" font-size="22" font-weight="750">Telemetry</text><text x="84" y="310" fill="#cbd5e1" font-size="16">Zeek · Suricata</text><text x="84" y="338" fill="#cbd5e1" font-size="16">Sysmon · Windows</text><text x="84" y="366" fill="#cbd5e1" font-size="16">Linux Audit · replay</text>
<rect x="350" y="190" width="230" height="190" rx="20" fill="#241b4b" stroke="#8b5cf6"/><rect x="350" y="190" width="230" height="9" rx="5" fill="url(#violet)"/><text x="374" y="235" fill="#c4b5fd" font-size="14" font-weight="700">02 / INGEST</text><text x="374" y="274" fill="#fff" font-size="22" font-weight="750">Collection</text><text x="374" y="310" fill="#ddd6fe" font-size="16">Collectors + replay</text><text x="374" y="338" fill="#ddd6fe" font-size="16">Source parsers</text><text x="374" y="366" fill="#ddd6fe" font-size="16">Canonical events</text>
<rect x="640" y="190" width="230" height="190" rx="20" fill="#3b1d3c" stroke="#ec4899"/><rect x="640" y="190" width="230" height="9" rx="5" fill="url(#pink)"/><text x="664" y="235" fill="#f9a8d4" font-size="14" font-weight="700">03 / PROCESS</text><text x="664" y="274" fill="#fff" font-size="22" font-weight="750">Event engine</text><text x="664" y="310" fill="#fce7f3" font-size="16">Bounded event queue</text><text x="664" y="338" fill="#fce7f3" font-size="16">Normalization + features</text><text x="664" y="366" fill="#fce7f3" font-size="16">Temporal state</text>
<rect x="930" y="190" width="230" height="190" rx="20" fill="#42251a" stroke="#f59e0b"/><rect x="930" y="190" width="230" height="9" rx="5" fill="url(#orange)"/><text x="954" y="235" fill="#fcd34d" font-size="14" font-weight="700">04 / DETECT</text><text x="954" y="274" fill="#fff" font-size="22" font-weight="750">Decisioning</text><text x="954" y="310" fill="#ffedd5" font-size="16">Rule + behavior checks</text><text x="954" y="338" fill="#ffedd5" font-size="16">Correlation + dedup</text><text x="954" y="366" fill="#ffedd5" font-size="16">Alert + evidence</text>
<rect x="1220" y="190" width="160" height="190" rx="20" fill="#12372f" stroke="#10b981"/><rect x="1220" y="190" width="160" height="9" rx="5" fill="url(#green)"/><text x="1242" y="235" fill="#6ee7b7" font-size="14" font-weight="700">05 / STORE</text><text x="1242" y="274" fill="#fff" font-size="22" font-weight="750">SQLite</text><text x="1242" y="310" fill="#d1fae5" font-size="15">Alerts</text><text x="1242" y="336" fill="#d1fae5" font-size="15">Evidence</text><text x="1242" y="362" fill="#d1fae5" font-size="15">Audit records</text>
</g>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 285H340"/><path d="M580 285H630"/><path d="M870 285H920"/><path d="M1160 285H1210"/></g>
<g filter="url(#shadow)" font-family="Inter,Arial"><rect x="350" y="500" width="300" height="155" rx="20" fill="#172554" stroke="#38bdf8"/><text x="378" y="542" fill="#7dd3fc" font-size="14" font-weight="700">INTELLIGENCE PROJECTION</text><text x="378" y="582" fill="#fff" font-size="23" font-weight="750">Entity intelligence</text><text x="378" y="616" fill="#cbd5e1" font-size="16">Hosts · users · processes</text><text x="378" y="640" fill="#cbd5e1" font-size="16">IPs · domains · hashes</text>
<rect x="760" y="500" width="300" height="155" rx="20" fill="#172554" stroke="#a78bfa"/><text x="788" y="542" fill="#c4b5fd" font-size="14" font-weight="700">ANALYST ACCESS</text><text x="788" y="582" fill="#fff" font-size="23" font-weight="750">FastAPI</text><text x="788" y="616" fill="#ddd6fe" font-size="16">Authenticated API</text><text x="788" y="640" fill="#ddd6fe" font-size="16">Role-aware operations</text>
<rect x="1170" y="500" width="210" height="155" rx="20" fill="#3b1d3c" stroke="#f472b6"/><text x="1195" y="542" fill="#f9a8d4" font-size="14" font-weight="700">INVESTIGATE</text><text x="1195" y="582" fill="#fff" font-size="23" font-weight="750">React UI</text><text x="1195" y="616" fill="#fce7f3" font-size="16">Alerts + incidents</text><text x="1195" y="640" fill="#fce7f3" font-size="16">Evidence + entities</text></g>
<g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M755 380V445H500V490"/><path d="M1060 575H1160"/><path d="M1370 430V475H910V490"/></g>
<text x="64" y="740" fill="#94a3b8" font-family="Inter,Arial" font-size="15">Bounded queues and temporal state · SQLite is the default local persistence backend · Telemetry sources are configured separately</text><text x="64" y="775" fill="#64748b" font-family="Inter,Arial" font-size="13">Conceptual view of current repository boundaries · Beta software</text><g aria-hidden="true"><circle class="ambient" cx="1370" cy="120" r="32" fill="#a78bfa"/><circle class="ambient" cx="95" cy="680" r="24" fill="#22d3ee" style="animation-delay:-3s"/><circle r="5.5" fill="#67e8f9" opacity=".98" filter="url(#shadow)"><animateMotion dur="1.50s" begin="0.00s" repeatCount="indefinite" path="M290 285H340"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#c4b5fd" opacity=".98" filter="url(#shadow)"><animateMotion dur="1.67s" begin="0.23s" repeatCount="indefinite" path="M580 285H630"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#f9a8d4" opacity=".98" filter="url(#shadow)"><animateMotion dur="1.84s" begin="0.46s" repeatCount="indefinite" path="M870 285H920"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#fcd34d" opacity=".98" filter="url(#shadow)"><animateMotion dur="2.01s" begin="0.69s" repeatCount="indefinite" path="M1160 285H1210"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#7dd3fc" opacity=".98" filter="url(#shadow)"><animateMotion dur="2.18s" begin="0.92s" repeatCount="indefinite" path="M755 380V445H500V490"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#c4b5fd" opacity=".98" filter="url(#shadow)"><animateMotion dur="2.35s" begin="1.15s" repeatCount="indefinite" path="M1060 575H1160"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#f9a8d4" opacity=".98" filter="url(#shadow)"><animateMotion dur="2.52s" begin="1.38s" repeatCount="indefinite" path="M1370 430V475H910V490"/><animate attributeName="r" values="3.5;6;3.5" dur="1.2s" repeatCount="indefinite"/></circle></g></svg>