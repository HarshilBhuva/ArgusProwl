<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">ArgusProwl detection lifecycle</title><desc id="desc">Six stages from normalized event to analyst-ready alert with colorful stage cards.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="a" x2="1" y2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="b" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient><linearGradient id="d" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#c2410c"/></linearGradient><linearGradient id="e" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#cbd5e1"/></marker></defs><rect width="1440" height="520" rx="26" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-family="Arial" font-size="31" font-weight="800">Detection lifecycle</text><text x="60" y="102" fill="#cbd5e1" font-family="Arial" font-size="17">A normalized observation becomes an explainable investigation artifact</text>
<g font-family="Arial"><g><rect x="55" y="175" width="190" height="190" rx="20" fill="#164e63" stroke="#22d3ee"/><rect x="55" y="175" width="190" height="8" rx="4" fill="url(#a)"/><text x="78" y="218" fill="#67e8f9" font-size="14" font-weight="700">01 · INPUT</text><text x="78" y="260" fill="#fff" font-size="22" font-weight="700">Normalize</text><text x="78" y="298" fill="#cffafe" font-size="16">Canonical event</text><text x="78" y="326" fill="#cffafe" font-size="16">Fields + metadata</text></g><g><rect x="285" y="175" width="190" height="190" rx="20" fill="#312e81" stroke="#a78bfa"/><rect x="285" y="175" width="190" height="8" rx="4" fill="url(#b)"/><text x="308" y="218" fill="#c4b5fd" font-size="14" font-weight="700">02 · EVALUATE</text><text x="308" y="260" fill="#fff" font-size="22" font-weight="700">Detect</text><text x="308" y="298" fill="#ede9fe" font-size="16">Configured rules</text><text x="308" y="326" fill="#ede9fe" font-size="16">Behavior signals</text></g><g><rect x="515" y="175" width="190" height="190" rx="20" fill="#831843" stroke="#f472b6"/><rect x="515" y="175" width="190" height="8" rx="4" fill="url(#c)"/><text x="538" y="218" fill="#f9a8d4" font-size="14" font-weight="700">03 · CONTEXT</text><text x="538" y="260" fill="#fff" font-size="22" font-weight="700">Enrich</text><text x="538" y="298" fill="#fce7f3" font-size="16">Entity context</text><text x="538" y="326" fill="#fce7f3" font-size="16">Optional ATT&amp;CK</text></g><g><rect x="745" y="175" width="190" height="190" rx="20" fill="#7c2d12" stroke="#fb923c"/><rect x="745" y="175" width="190" height="8" rx="4" fill="url(#d)"/><text x="768" y="218" fill="#fdba74" font-size="14" font-weight="700">04 · DECIDE</text><text x="768" y="260" fill="#fff" font-size="22" font-weight="700">Correlate</text><text x="768" y="298" fill="#ffedd5" font-size="16">Temporal logic</text><text x="768" y="326" fill="#ffedd5" font-size="16">Dedup + decision</text></g><g><rect x="975" y="175" width="190" height="190" rx="20" fill="#064e3b" stroke="#34d399"/><rect x="975" y="175" width="190" height="8" rx="4" fill="url(#e)"/><text x="998" y="218" fill="#6ee7b7" font-size="14" font-weight="700">05 · RECORD</text><text x="998" y="260" fill="#fff" font-size="22" font-weight="700">Persist</text><text x="998" y="298" fill="#d1fae5" font-size="16">Alert + evidence</text><text x="998" y="326" fill="#d1fae5" font-size="16">Audit trail</text></g><g><rect x="1205" y="175" width="190" height="190" rx="20" fill="#164e63" stroke="#38bdf8"/><rect x="1205" y="175" width="190" height="8" rx="4" fill="url(#a)"/><text x="1228" y="218" fill="#7dd3fc" font-size="14" font-weight="700">06 · RESPOND</text><text x="1228" y="260" fill="#fff" font-size="22" font-weight="700">Investigate</text><text x="1228" y="298" fill="#e0f2fe" font-size="16">Analyst dashboard</text><text x="1228" y="326" fill="#e0f2fe" font-size="16">Human decision</text></g></g>
<g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#ar)"><path d="M245 270H275"/><path d="M475 270H505"/><path d="M705 270H735"/><path d="M935 270H965"/><path d="M1165 270H1195"/></g><text x="60" y="435" fill="#cbd5e1" font-family="Arial" font-size="16">Detection output is an investigative signal — not proof of malicious activity or authorization for autonomous response.</text></svg>